<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hej Fika Menu</title>

  <!-- Styles -->
<!-- Change the order - navigation first -->
<link rel="stylesheet" href="navegationBar.css" />
<link rel="stylesheet" href="menu.css" />
<link rel="stylesheet" href="off-screen-menu.css" />
<link rel="stylesheet" href="popup.css" />
<link rel="stylesheet" href="favorite.css" />
<link rel="stylesheet" href="bag.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">

</head>

<body>

<!-- Off-screen Menu -->
<div class="off-screen-menu">
        <div class="offMenu-content">
            <ul class="menuList">
                <a href="./login.html">
                    <li id="Sign-up" class="list">
                    <div>
                        <img class="menuIcon" src="./assets/functional-icons/Account-icon.svg" alt="user account icon">
                        Login / Sign-up
                    </div>
                    <img class="menuIcon" src="./assets/functional-icons/chevron_white_right-icon.svg" alt="chevron white right icon">
                </li>
                </a>
                <a href="./menu.html">
                    <li id="menu" class="list">
                        <div>
                            <img class="menuIcon" src="./assets/functional-icons/Menu-icon.svg" alt="menu icon">
                        Menu
                       </div>
                    <img class="menuIcon" src="./assets/functional-icons/chevron_white_right-icon.svg" alt="chevron white right icon">
                </li>
                </a>
                <li id="favorites" class="list">
                    <div>
                        <img class="menuIcon" src="./assets/functional-icons/Favorite Heart-icon.svg" alt="heart icon">
                        Favorites
                    </div>

                    <img class="menuIcon" src="./assets/functional-icons/chevron_white_right-icon.svg" alt="chevron white right icon">
                </li>
                <li id="yourBag" class="list">
                    <div>
                        <img class="menuIcon" src="./assets/functional-icons/bag-icons/icon-empty_bag-white.svg" alt="empty bag icon">
                        Your bag
                    </div>
                    <img class="menuIcon" src="./assets/functional-icons/chevron_white_right-icon.svg" alt="chevron white right icon">
                </li>
                <li id="wwu" class="list">
                    <div>
                        <img class="menuIcon" src="./assets/functional-icons/Work_with_Us-icon.svg" alt="Work with us icon">
                        Work with us
                    </div>
                    <img class="menuIcon" src="./assets/functional-icons/chevron_white_right-icon.svg" alt="chevron white right icon">
                </li>
                <li id="aboutUs" class="list">
                    <div>
                        <img class="menuIcon" src="./assets/functional-icons/About_Us-icon.svg" alt="about us icon">
                        About us
                    </div>
                    <img class="menuIcon" src="./assets/functional-icons/chevron_white_right-icon.svg" alt="chevron white right icon">
                </li>
            </ul>
        </div>
    </div>

<!-- Navigation Bar -->
<nav id="navBar" class="top-navBar">
  <div id="navBarContainer">

    <!-- Left: Logo -->
    <div class="leftIcons">
      <a href="index.html">
        <img src="./assets/logo-horizontal.svg" alt="logo" class="nav-logo">
      </a>
    </div>

    <!-- Center: Bag Icon 
    <div class="centerIcons">
      <div class="empty_bag-icon">
        <img src="./assets/functional-icons/bag-icons/icon-empty_bag.svg" alt="bag">
        <span class="bag-item-count">0</span>
      </div>
    </div>-->

    <!-- Right: Hamburger Menu -->
   <div class="rightIcons">
    <div id="bagIcon" class="bag-container">
        <img  id="bagImage" src="./assets/functional-icons/bag-icons/icon-empty_bag.svg" alt="empty bag icon">
       <span id="bagCount" class="bag-count">0</span>
    </div>

      <div class="ham-menu">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

  </div>
</nav>

<!-- Top Background -->
<div class="header-container">
  <div class="top-background">
    <div class="background-image-container">
      <img id="bg-image" src="assets/menu/menu_covers/Menu-Covers.jpg" alt="Menu Background">
    </div>
    <div class="section-title">MENU</div>
  </div>
</div>

<!-- Main Menu Container -->
<main>
  <div class="menu-section" id="menuContainer"></div>
</main>

<!-- Product Modal -->
<div id="productModal" class="modal">
  <div class="modal-content">

    <div class="modal-product">

      <span class="close">&times;</span>

      <div class="modal-top-row">

        <div class="modal-image-wrap">
          <img id="modal-img" src="" alt="">
        </div>

        <div class="modal-title-wrap">
          <h3 id="modal-name"></h3>
        </div>

        <div class="favorite-icon-static">
          <img src="assets/functional-icons/Favorite Heart-icon.svg" alt="favorite">
        </div>

      </div>

      <div class="modal-bottom-row">
        <div class="qty-wrap">
          <button id="decrease" class="qty-btn">-</button>
          <span id="quantity">1</span>
          <button id="increase" class="qty-btn">+</button>
        </div>

        <button id="add-to-cart" class="add-to-cart-inline">
          <span>Add to Cart</span>
          <span id="inline-price"></span>
        </button>
      </div>

    </div>
  </div>
</div>

<!-- Footer -->
<footer>
  <div>
    <a href="index.html">
      <img src="./assets/logo.svg" alt="logo">
    </a>
  </div>

  <ul>
    <li>
      <a href="https://maps.app.goo.gl/qqVpT9CNNpfgvbWc6" target="_blank">
        Sveavägen 39, 111 34 Stockholm
      </a>
    </li>
    <li>Contact us</li>
    <li>About us</li>
    <li>Policy</li>
  </ul>

  <div id="socialIcons" class="footer-socialIcons">
    <div><img src="./assets/social-icons/facebook-icon.svg" alt=""></div>
    <div><img src="./assets/social-icons/instagram-icon.svg" alt=""></div>
    <div><img src="./assets/social-icons/github-icon.svg" alt=""></div>
  </div>
</footer>

<!-- Scripts (correct order and safe) -->
<script src="index.js" defer></script>
<script src="favorite.js" defer></script>

<script type="module" src="cart-handler.js"></script>
<script type="module" src="menu-cart.js"></script>
<!-- Module script for menu logic -->
<script type="module" src="menu.js"></script>

</body>
</html>
