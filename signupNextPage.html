<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="navegationBar.css">
</head>

<body>


    <nav id="navBar" class="top-navBar">
        <div id="navBarContainer">
            <div class="leftIcons">
                <div class="chevron_left-icon"><img src="./assets/functional-icons/chevron_black_left-icon.svg"
                        alt="chevron black left icon"></div>
                <div><a href="index.html"><img src="./assets/logo-horizontal.svg" alt="logotype"></a></div>
            </div>
            <div class="rightIcons">
                <div><img src="./assets/functional-icons/hamburger-menu-icon.svg" alt="hambureger menu icon"></div>
            </div>
        </div>
    </nav>
    <section id="header">
        <div class="signup">
            <h1>
                Sign-up Details
            </h1>
        </div>
        <div class="progress-2">
            <div class="step active">1</div>
            <div class="line"></div>
            <div class="step">2</div>
        </div>

    </section>

    <section id="form">
        <form class="form-inputs">
            <div class="input-group">
                <label for="email-input">Email *</label>
                <input type="email" name="email" id="email-input" placeholder="Email" required>
            </div>
            <div class="input-group">
                <label for="Mobil Number-input">Mobil Number *</label>
                <input type="tel" name="mobileNumber" id="mobileNumber-input" placeholder="Mobil Number" required>
            </div>
            <div class="input-group">
                <label for="NewPassword-input">New Password *</label>
                <input type="password" id="NewPassword-input" minlength="8" placeholder="New Password  " required>
            </div>
            <div class="input-group">
                <label for="RepeatPassword-input">Repeat Password *</label>
                <input type="password" id="RepeatPassword-input" minlength="8" placeholder="Repeat Password  " required>
            </div>


            <button type="submit" class="login">Login</button>

        </form>

    </section>


</body>

</html>
