<div class="intro">
  <h2 class="intro-cart">Checkout</h2>
</div>


<main class="checkout-container">

    <!-- ORDER SUMMARY -->
    <section class="order-summary">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Latte</span>
        <span>€4.50</span>
      </div>
      <div class="summary-row">
        <span>Cappuccino</span>
        <span>4.00 SEK</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span>8.50 SEK</span>
      </div>
    </section>
  
    <!-- PAYMENT METHODS -->
    <section class="payment-section">
      <h3>Payment Method</h3>
  
      <div class="payment-tabs">
        <button class="payment-tab active" data-method="card">Credit Card</button>
        <button class="payment-tab" data-method="apple">Apple Pay</button>
        <button class="payment-tab" data-method="swish">Swish</button>
      </div>
  
      <!-- CREDIT CARD -->
      <form class="payment-form active" id="card-form">
        <input type="text" placeholder="Cardholder Name" required>
        <input type="text" placeholder="Card Number" maxlength="16" pattern="\d{16}" required>
        <div class="row">
          <input type="text" placeholder="MM/YY" pattern="\d{2}/\d{2}" required>
          <input type="text" placeholder="CVC" maxlength="3" pattern="\d{3}" required>
        </div>
      </form>
  
      <!-- APPLE PAY -->
      <form class="payment-form" id="apple-form">
        <input type="email" placeholder="Apple ID Email" required>
      </form>
  
      <!-- SWISH -->
      <form class="payment-form" id="swish-form">
        <input type="tel" placeholder="Swish Phone Number" pattern="\d{10}" required>
      </form>
  
    </section>
  
  </main>
  
  <!-- PAY BUTTON -->
  <div class="cart-footer">
    <button id="checkoutBtn" class="checkout-btn" disabled>
      Pay Now
    </button>
  </div>
  
  <script type="module" src="./cart.js"></script>
  <script type="module" src="./swipe.js"></script>
  <script src="./checkout.js"></script>
  
  </body>
  </html>
