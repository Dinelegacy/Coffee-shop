<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Out</title>
    <link rel="stylesheet" href="checkout.css">
</head>

<body>

  <!-- CHECKOUT SECTION -->
<div class="checkout-wrapper">

  <!-- Header + Progress Steps -->
  <div id="header">
      <h1>Checkout</h1>

      <div class="progress">
          <div class="step active" data-step="1">1</div>
          <div class="line"></div>
          <div class="step" data-step="2">2</div>
          <div class="line"></div>
          <div class="step" data-step="3">3</div>
          <div class="line"></div>
          <div class="step" data-step="4">4</div>
          <div class="line"></div>
          <div class="step" data-step="5">5</div>
      </div>
  </div>

  <!-- Slider -->
  <div class="slider-viewport">
      <div class="slider-track">

          <!-- CARD 1 — Customer Info -->
          <div class="card">
              <h2>Customer Information</h2>
              <div class="form-inputs">
                  <div class="input-group">
                      <label>Full Name</label>
                      <input type="text" id="name" placeholder="John Doe">
                  </div>
                  <div class="input-group">
                      <label>Email</label>
                      <input type="email" id="email" placeholder="name@email.com">
                  </div>
                  <div class="input-group">
                      <label>Phone Number</label>
                      <input type="tel" id="phone" placeholder="123-456-7890">
                  </div>
              </div>

              <div class="card-actions">
                  <button class="next-button" onclick="nextStep()">Next</button>
              </div>
          </div>

          <!-- CARD 2 — Table Number -->
          <div class="card">
              <h2>Table Number</h2>

              <div class="input-group">
                  <label>Enter Your Table Number</label>
                  <input type="number" id="table-number" placeholder="e.g. 12">
              </div>

              <div class="card-actions">
                  <button class="back-button" onclick="prevStep()">Back</button>
                  <button class="next-button" onclick="nextStep()">Next</button>
              </div>
          </div>

          <!-- CARD 3 — Payment -->
          <div class="card">
              <h2>Payment Details</h2>

              <div class="form-inputs">
                  <div class="input-group">
                      <label>Card Number</label>
                      <input type="text" placeholder="xxxx xxxx xxxx xxxx">
                  </div>

                  <div class="row">
                      <div class="input-group" style="flex:1;">
                          <label>Expiry</label>
                          <input type="month">
                      </div>
                      <div class="input-group" style="flex:1;">
                          <label>CVC</label>
                          <input type="password">
                      </div>
                  </div>
              </div>

              <div class="card-actions">
                  <button class="back-button" onclick="prevStep()">Back</button>
                  <button class="next-button" onclick="nextStep()">Next</button>
              </div>
          </div>

          <!-- CARD 4 — Review Order -->
          <div class="card">
              <h2>Review Your Order</h2>

              <div class="order-summary">
                  <div class="summary-row"><span>Items</span> <span id="summary-items">$14.00</span></div>
                  <div class="summary-row"><span>Tax</span> <span>$1.40</span></div>
                  <div class="summary-row"><span>Tip</span> <span id="summary-tip">$0.00</span></div>
                  <div class="summary-row total-row"><span>Total</span> <span id="summary-total">$15.40</span></div>
              </div>

              <h3>Add a Tip?</h3>
              <div class="tip-buttons">
                  <div class="tip" onclick="selectTip(0)">No Tip</div>
                  <div class="tip" onclick="selectTip(2)">$2</div>
                  <div class="tip" onclick="selectTip(5)">$5</div>
              </div>

              <div class="card-actions">
                  <button class="back-button" onclick="prevStep()">Back</button>
                  <button class="confirm-button" onclick="confirmOrder()">Confirm</button>
              </div>
          </div>

          <!-- CARD 5 — Success -->
          <div class="card">
              <h2>Order Successful 🎉</h2>
              <p>Your coffee is being prepared!</p>

              <div class="order-message" id="orderMessage">Enjoy your drink!</div>
          </div>

      </div>
  </div>
</div>


  
  <script src="checkout.js" defer></script>
</body>

</html>
