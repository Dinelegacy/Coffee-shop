<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>
    <div class="app">

    <div id="logo">
        <img src="assets/logo-horizontal.svg" alt="logo">
        <img src="assets/functional-icons/hamburger-menu-icon.svg" alt="menu-icon">

</div>
    <section id="header">
        <div class="signup">
            <h1>
                Sign-up Details
            </h1>
        </div>
        <div class="progress">
            <div class="step active">1</div>
            <div class="line"></div>
            <div class="step">2</div>
        </div>



    </section>

    <section id="form">
        <form class="form-inputs">
            <div class="input-group">
                <label for="firstname-input">First Name</label>
                <input type="text" name="firstname" id="firstname-input" placeholder="First Name" required>
            </div>
            <div class="input-group">
                <label for="lastname-input">Last Name</label>
                <input type="text" name="lastname" id="lastname-input" placeholder="Last Name" required>
            </div>
            <div class="input-group">
                <label for="DateofBirth-input">Date of Birth </label>
                <input type="date" id="DateofBirth-input" placeholder="Date of Birth " required>
            </div>

        </form>

        <button class="next-button">
            Next
        </button>


    </section>

    </div>
</body>

</html>
