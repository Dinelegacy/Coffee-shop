<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="navegationBar.css">
</head>

<body>


    <nav id="navBar" class="top-navBar">
        <div id="navBarContainer">
            <div class="leftIcons">
                
                <div><a href="index.html"><img src="./assets/logo-horizontal.svg" alt="logotype"></a></div>
            </div>
            <div class="rightIcons">
                <div><img src="./assets/functional-icons/hamburger-menu-icon.svg" alt="hambureger menu icon"></div>
            </div>
        </div>
    </nav>
    <section id="header">
        <div class="signup">
            <h1>
                Sign-up Details
            </h1>
        </div>
        <div class="progress">
            <div class="step active">1</div>
            <div class="line"></div>
            <div class="step">2</div>
        </div>



    </section>

    <section id="form">
        <form class="form-inputs">
            <div class="input-group">
                <label for="firstname-input">First Name *</label>
                <input type="text" name="firstname" id="firstname-input" placeholder="First Name">
            </div>
            <div class="input-group">
                <label for="lastname-input">Last Name *</label>
                <input type="text" name="lastname" id="lastname-input" placeholder="Last Name">
            </div>
            <div class="input-group">
                <label for="DateofBirth-input">Date of Birth*</label>
                <input type="date" id="DateofBirth-input" placeholder="Date of Birth ">
            </div>

        </form>


        <a class="next-button" href="signupNextPage.html">Next</a>


    </section>


</body>

</html>
